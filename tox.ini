[tox]
isolated_build=true
envlist=
    py31{1,2,3}
    mypy
    black
    flake8

[default]
sources = src

[testenv]
wheel = True
parallel_show_output = True
passenv = *
deps =
    -r coverage-requirements.txt
    -r test-requirements.txt
commands =
    python -V
    python -m coverage run -p -m unittest discover -s src -v {posargs:}

[testenv:mypy]
use_develop = true
deps =
    -r mypy-requirements.txt
commands =
    mypy ./src ./docs

[testenv:black]
deps =
    -r black-requirements.txt
commands =
    black --check ./src

[testenv:flake8]
deps =
    -r flake8-requirements.txt
commands =
    flake8 ./src

[flake8]
ignore = E203, W503, E704
